<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101217">
    <title>OpenAPA — Audio examples</title>
    <style>
        :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #101217; color: #f4f5f7; }
        main { width: min(90vw, 640px); text-align: center; }
        h1 { font-size: clamp(2.5rem, 9vw, 5rem); font-weight: 300; letter-spacing: -.04em; margin: 0; }
        p { color: #b8bdc9; line-height: 1.6; }
        a { display: inline-block; margin-top: 1rem; padding: .8rem 1.3rem; border: 1px solid #576179; border-radius: 999px; color: #f4f5f7; text-decoration: none; }
        a:hover, a:focus-visible { border-color: #b8c9ff; background: #202737; }
    </style>
</head>
<body>
    <main>
        <h1>OpenAPA</h1>
        <p>Open-response pronunciation assessment</p>
        <a href="audios/">Listen to audio examples →</a>
    </main>
</body>
</html>
