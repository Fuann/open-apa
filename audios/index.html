<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101217">
    <title>Audio examples — OpenAPA</title>
    <style>
        :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        * { box-sizing: border-box; }
        body { min-height: 100vh; margin: 0; background: #101217; color: #f4f5f7; }
        main { width: min(90vw, 760px); margin: 0 auto; padding: clamp(3rem, 9vw, 6rem) 0; }
        nav a { color: #b8c9ff; text-decoration: none; }
        nav a:hover { text-decoration: underline; }
        h1 { font-size: clamp(2rem, 6vw, 3.5rem); font-weight: 350; letter-spacing: -.035em; margin: 3rem 0 .6rem; }
        .intro { color: #b8bdc9; line-height: 1.6; margin-bottom: 2.5rem; }
        .sample { padding: 1.8rem; background: #1a1d25; border: 1px solid #323847; border-radius: 18px; }
        .sample h2 { font-size: 1.2rem; font-weight: 500; margin: 0 0 .4rem; }
        .sample p { color: #b8bdc9; font-size: .95rem; margin: 0 0 1.5rem; }
        audio { display: block; width: 100%; margin-bottom: 1rem; }
        .detail { margin-top: 1rem; padding-top: 1rem; border-top: 1px solid #2c3a49; }
        .detail h4 { margin: 0 0 .6rem; font-size: .95rem; font-weight: 500; color: #c8d1e5; }
        .detail p { margin: 0; line-height: 1.6; }
        .spectrogram { display: block; width: 100%; height: auto; border-radius: 8px; }
        .waveform-panel { margin: 1.5rem 0; padding: 1rem; background: #111821; border: 1px solid #2c3a49; border-radius: 12px; overflow: hidden; }
        .waveform-heading { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
        .waveform-heading h3 { margin: 0; color: #d2e6ef; font-size: .95rem; font-weight: 500; }
        .waveform-heading span { font-size: .65rem; letter-spacing: .14em; color: #87adbd; }
        #waveform { display: block; width: 100%; height: clamp(305.9px, calc(42.5vw - 8.6px), 356.9px); }
        .sample .waveform-caption { margin: .5rem 0 0; font-size: .78rem; line-height: 1.5; color: #98a6bb; }
        @media (max-width: 480px) { .sample { padding: 1rem; } .waveform-panel { padding: .7rem; } }
        .waveform-stage { position: relative; }
        .waveform-controls { display: flex; align-items: center; gap: .7rem; padding: .5rem .3rem; }
        .waveform-controls[hidden] { display: none; }
        .waveform-controls button { flex: 0 0 40px; height: 40px; border: 1px solid #4b7181; border-radius: 50%; background: #223a48; color: #d5f5f7; cursor: pointer; font-size: 16px; }
        .waveform-controls button:hover { background: #305366; }
        .waveform-controls input { min-width: 0; flex: 1; accent-color: #99d9e4; cursor: pointer; height: 32px; }
        .waveform-controls output { white-space: nowrap; font-size: .75rem; color: #b6c9d7; font-variant-numeric: tabular-nums; }
        .waveform-controls button:focus-visible, .waveform-controls input:focus-visible { outline: 2px solid #99d9e4; outline-offset: 3px; }
        .waveform-interactive { cursor: ew-resize; touch-action: pan-y; }
        audio[hidden] { display: none; }
        .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
    </style>
</head>
<body>
    <main>
        <nav><a href="../">← OpenAPA</a></nav>
        <h1>Audio examples</h1>
        <p class="intro">Listen to the audio sample used in the paper.</p>
        <section class="sample" aria-labelledby="sample-title">
            <h2 id="sample-title">Sample audio</h2>
            <p>2311_096180014 · WAV</p>
            <section class="waveform-panel" aria-label="Audio visualization and playback">
                <canvas id="waveform" role="img" aria-label="Amplitude waveform and spectrogram of the sample recording sharing a synchronized playback position marker" aria-describedby="waveform-status">Amplitude waveform and spectrogram of the sample recording.</canvas>
                <div class="waveform-controls" hidden>
                    <button id="waveform-play" type="button" aria-label="Play recording">▶</button>
                    <input id="waveform-seek" type="range" min="0" max="100" value="0" step="0.01" aria-label="Playback position">
                    <output id="waveform-time" for="waveform-seek">0:00 / 0:00</output>
                    <button id="waveform-mute" type="button" aria-label="Mute recording" aria-pressed="false">♪</button>
                </div>
                <div class="reference-text sr-only">
                    <h4>Reference text</h4>
                    <p>I always thought he was a good person</p>
                </div>
                <p id="waveform-status" class="waveform-caption" role="status">Loading waveform…</p>
            </section>
            <audio controls preload="metadata" aria-label="Play sample audio">
                <source src="sample.wav" type="audio/wav">
                Your browser does not support audio playback.
            </audio>
        </section>
    </main>
    <script src="waveform.js" defer></script>
</body>
</html>
